<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de iframe</title>
    <style>
        iframe { 
            width: 400px;
            height: 400px; 
            border: 2px solid black;
            /*border: 2px dashed serve para fazer a borda pontiada;*/    
        }
    </style>
</head>
<body>
    
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando site do 
        
        <!--Tamanho padrão do iframe 300 largura e 150 de altura--> 
        <!--A scolling="Auto é o padrão e no depedendo no navegador 
        não permite a barra de rolagem " e o yes serve para aparecer a 
        barra de rolagem dentro do conteudo-->
        <!--"frameborder="se colocar 1 ou 2 a imagem vai ficar com a borda o padrão é o 0"-->
        <iframe src="https://www.cursoemvideo.com"frameborder="0" height="500" scolling="auto">
            <a href="httpswww.cursoemvideo.com" target="_blank">Curso em vídeo</a>
            </iframe>
            para aprender programar.
        </p> 
        <p>
            O repositorio do Guanabara
            <!--"frameborder="se colocar 1 ou 2 a imagem vai ficar com a borda o padrão é o 0"-->
            <iframe src="https://gustavoguanabara.github.io"frameborder="0" height="500" width="500">
                no <a href="https://gustavoguanabara.github.io" target="_blank">Github</a>
            </iframe>

            também é legal
        </p>    
</body>
</html>
